<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Catio Company Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#293b34;--muted:#64716b;--green:#e4eddd;--dark:#345546;--line:#dce2dc;--paper:#fff;--bg:#f5f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Manrope,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}.shell{max-width:1100px;margin:36px auto;border:1px solid var(--line);border-radius:24px;background:#fff;overflow:hidden;box-shadow:0 18px 60px #263b3010}header{display:flex;align-items:center;justify-content:space-between;padding:22px 30px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;object-fit:contain;border-radius:10px;flex:none}.brand-name{margin:0;font:700 22px/1.2 Quicksand,sans-serif}.brand small,.brand-location{display:block;margin-top:3px;color:var(--muted);font:12px/1.4 Manrope,sans-serif}h2{font-family:Quicksand,sans-serif}h2{font-size:20px;margin:0 0 8px}.tabs{display:flex;gap:8px;padding:20px 24px 0}.tabs a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 15px;color:var(--ink)}.chat{padding:20px 24px}.messages{height:320px;overflow:auto;padding-right:8px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:90%;padding:15px 18px;border-radius:17px;background:#f1f4ef;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#e4eddd}.bubble small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.composer{display:flex;gap:10px;margin-top:8px}.composer textarea{resize:vertical;min-height:55px;max-height:130px;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.primary{background:var(--dark);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.subtle{font-size:11px;color:var(--muted);margin:12px 0}.consent{display:flex;align-items:flex-start;gap:8px;font-size:12px;margin:12px 0}.consent input{margin-top:5px;flex-shrink:0}.form{padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label.field{font-size:12px;font-weight:600}label.field input,label.field select,label.field textarea{display:block;width:100%;border:1px solid var(--line);border-radius:9px;margin-top:5px;padding:9px 11px;background:white;color:var(--ink)}.wide{grid-column:1/-1}.status{padding:12px 0;color:var(--muted);font-size:12px;white-space:pre-wrap}.status.error{color:#9d3430}.projects{display:grid;gap:9px;margin-top:15px}.projects a{display:block;color:var(--dark);background:#f4f6f2;padding:12px;border-radius:10px;text-decoration:none}.projects small{display:block;color:var(--muted)}footer{padding:15px 26px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}[hidden]{display:none!important}#language{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:white} @media(max-width:730px){.shell{margin:0;border-radius:0;border:0}header{padding:16px;gap:10px}.messages{height:330px}.fields{grid-template-columns:1fr}.brand{gap:8px}.brand img{width:40px;height:40px}.brand-name{font-size:17px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><img src="https://static.wixstatic.com/media/a63977_64328a70852c4f61be3fcd690dfb870d~mv2.jpg/v1/fill/w_65,h_66,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/607956025_1145504877773919_3383573754204268293_n.jpg" alt="" width="54" height="54"><div><h1 class="brand-name">The Catio Company</h1><small>Made for Happier Cats</small><span class="brand-location">Portland · Vancouver</span></div></div><select id="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></header>
<section aria-label="The Catio Company Assistant"><nav class="tabs" aria-label="Assistant tools"><a href="https://www.thecatiocompany.com/contact-us" target="_blank" rel="noopener noreferrer" data-i="contactForm">Request an estimate</a><a href="mailto:info@thecatiocompany.com" data-i="emailDirect">Email us directly</a></nav>
<div id="chatPanel" class="chat"><div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
<form id="chatForm"><label class="subtle" for="message" data-i="messageLabel">Your question</label><div class="composer"><textarea id="message" maxlength="1500" required></textarea><button id="send" class="primary" data-i="send">Send</button></div></form>
<div id="chatStatus" class="status" role="status"></div><div id="projects" class="projects"></div><p class="subtle" data-i="aiNotice">Responses may need the team's review. This chat does not book, charge or submit a project request.</p></div>
</section><footer data-i="footer">Draft preview · Request an estimate through Contact Us.</footer>
</main><script src="/dev/chat.js" defer></script></body></html>
